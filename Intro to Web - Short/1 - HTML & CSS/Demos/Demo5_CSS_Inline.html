<body>

<h1 style="background-color: purple; color:blue">Hello world</h1>

<input type="text" style="background-color: pink; color:yellow">
<br/><br/>



<!-- Hide/Show elemnts - Option 1 - "Display" key --->
<!-- Show the green div --->
<div style="background-color: red;width: 100px;height: 100px;;"></div>
<div style="display: block ; background-color: green;width: 50px;height: 50px;;"></div>
<div style="background-color: blue;width: 50px;height: 50px;;"></div>
<br/>
<!-- Hide the green div --->
<div style="background-color: red;width: 100px;height: 100px;;">
    <div style="background-color: blue;width: 50px;height: 50px;;"></div>
</div>
<div style="display: none ; background-color: green;width: 50px;height: 50px;;"></div>
<div style="background-color: blue;width: 50px;height: 50px;;"></div>
<br/><br/>




<!-- Hide/Show elemnts - Option 2 - "visibiliity" key --->
<!-- Show the green div --->
<div style="background-color: red;width: 100px;height: 100px;;"></div>
<div style="visibility: visible ; background-color: green;width: 50px;height: 50px;;"></div>
<div style="background-color: blue;width: 50px;height: 50px;;"></div>
<br/>
<!-- Hide the green div --->
<div style="background-color: red;width: 100px;height: 100px;;"></div>
<div style="visibility: hidden ; background-color: green;width: 50px;height: 50px;;"></div>
<div style="background-color: blue;width: 50px;height: 50px;;"></div>



</body>


</html>
