<html>
    <script>

        function Add(num1,num2)
        {
           return num1+num2;
        }

        function Mul(num1,num2)
        {
           let total = 0;
           for(let i=0; i < num1; i++)
           {
               total = Add(total, num2);
           }
           return total;
        }


       
        console.log(Mul(3,4));

    </script>
</html>
