<html>
    <script>

        function GetSum(arr)
        {
            let total = 0;
            for(let i=0; i < arr.length; i++)
            {
                if(arr[i] >= 3 && arr[i] <= 6)
                {
                    total += arr[i];
                }
            }
            return total;
        }

    </script>
</html>
