<html>
    <script>

        function CountA(arr)
        {
            let counter = 0;
            for(let i=0; i < arr.length; i++)
            {
                for(let j=0; j < arr[i].length; j++)
                {
                    if(arr[i][j] == "A")
                    {
                        counter++;
                    }
                }
            }
            
            return counter;
        }


        let arr = ["AbC" , "AAasa"]
        console.log(CountA(arr));

    </script>
</html>
