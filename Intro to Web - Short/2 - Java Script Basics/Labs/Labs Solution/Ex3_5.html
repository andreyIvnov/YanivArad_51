<html>
    <script>

       function GetAvg(arr)
       {
            let counter = 0;
            let total = 0;

            for(let i=0; i < arr.length; i++)
            {
                for(let j=0; j < arr[i].length; j++)
                {
                    total += arr[i][j];
                    counter++;
                }
            }

            return total / counter;
       }

        console.log( GetAvg([ [1,2,3], [4,5,6] , [7,8,9] ]) );

       

    </script>
</html>
