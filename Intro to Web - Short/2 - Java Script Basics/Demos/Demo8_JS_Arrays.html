<html>

<head>

<script>
// Arrays in JS can be at any size and with any types
var arr = [1 , "Hello" , true , [5,8,2]]

//Print arr length 
console.log(arr.length) // Print 4

//Print the first item
console.log(arr[0]) // print 1

//Print the last item
console.log(arr[3]) // print [5,8,2]

//print inner item
console.log(arr[3][1]) // print 8


// Empty array
var arr = []

//Add to the array
arr.push(6)
arr.push(7)
arr.push("Hello")
arr.push(9)
arr.push(10)


console.log(arr) // print [6,7,"Hello",9,10]


//Remove from the array:
arr.splice(1,2) // remove 2 elements from  index 1

console.log(arr) // print [6,9,10]



</script>

</head>

</body>
