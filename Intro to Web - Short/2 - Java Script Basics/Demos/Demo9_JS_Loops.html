<script>
 // for loops
 for(var i=0; i < 5; i++)
 {
     console.log(i)
 }


 var arr = [4,6,2,8,9]
 for(var i=0; i < arr.length; i++)
 {
     console.log(arr[i])
 }


 //While Loops
 var num = 5;
 while(num>0)
 {
     console.log(num);
     num--;
 }

 //do-while loops
 var num = 5;
 do
 {
    console.log(num);
     num--;
 }while(num>0);



</script>
